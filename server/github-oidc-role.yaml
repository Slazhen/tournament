AWSTemplateFormatVersion: '2010-09-09'
Description: >
  The role GitHub Actions assumes to deploy the MFTournament API. Deploy this
  once, by hand, then put the RoleArn output into the repository secret
  AWS_DEPLOY_ROLE_ARN.

  There is no access key anywhere in this: GitHub proves who it is with a signed
  OIDC token, and the trust policy below only accepts tokens issued for this one
  repository and its branches.

Parameters:
  GitHubRepository:
    Type: String
    Default: Slazhen/tournament
    Description: owner/repo allowed to assume this role.
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      Set to false if this account already has the GitHub OIDC provider
      (token.actions.githubusercontent.com) registered.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mftournament-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                # Only workflows running on a branch of this repository. A pull
                # request from a fork cannot assume this role.
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepository}:ref:refs/heads/*'
      Policies:
        - PolicyName: deploy-sam-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mftournament-api/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: DeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-*/*'
              - Sid: FunctionAndApi
                Effect: Allow
                Action:
                  - lambda:*
                  - apigateway:*
                  - logs:*
                Resource: '*'
              - Sid: ExecutionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mftournament-api-*'

Outputs:
  RoleArn:
    Description: Put this in the GitHub repository secret AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
