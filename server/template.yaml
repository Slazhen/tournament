AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  MFTournament API. All DynamoDB and S3 access happens here, under the Lambda
  execution role below. The browser gets no AWS credentials of any kind.

Parameters:
  AllowedOrigins:
    Type: String
    Description: Comma-separated list of site origins allowed to call this API.
    Default: https://myfootballtournament.com,https://www.myfootballtournament.com
  ImagesBucket:
    Type: String
    Default: football-tournaments-images
  TablePrefix:
    Type: String
    Default: football-tournaments
  PublicCacheSeconds:
    Type: String
    Default: '60'
  ServerCacheSeconds:
    Type: String
    Default: '60'
  AdminCacheSeconds:
    Type: String
    Description: How stale a signed-in read may be. Zero reads through to DynamoDB.
    Default: '0'
  SiteUrl:
    Type: String
    Description: Where password-reset links point.
    Default: https://myfootballtournament.com
  MailFrom:
    Type: String
    Description: >
      Sender for password-reset email, on a domain verified in SES. Leave empty
      until SES is set up: the API then issues reset links without sending them
      rather than failing the request.
    Default: ''

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    # A cold start was measured at ten seconds from a browser in Sydney: what a
    # visitor arriving after a quiet period waited before the first screenful of
    # data. Lambda hands a function CPU in proportion to its memory, and
    # initialisation - unpacking the code, parsing a bundle of this size,
    # building the AWS clients - is the part of a request that is pure CPU. The
    # memory here is bought for the speed and not for the space, so the bill is
    # roughly flat: twice the price per millisecond over a duration that falls
    # by about as much. Check Max Memory Used in a REPORT line before assuming
    # it is enough or too much.
    MemorySize: 1024
    Timeout: 15
    Tracing: Active

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # CORS is answered in application code so the allow-list can be checked
      # per request against ALLOWED_ORIGINS rather than hard-coded here.
      Tags:
        Project: mftournament

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: true
        Target: node20
        # Off deliberately, together with the --enable-source-maps that used to
        # sit in NODE_OPTIONS below. The map was 3.3 MB against a 861 KB
        # bundle - four fifths of the package a cold container downloads before
        # it can run - and the flag makes Node read and hold it. What the pair
        # bought was readable line numbers in CloudWatch. Turn them back on
        # together while chasing something that needs them.
        Sourcemap: false
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/handler.ts
        # An ES module has no `require`, but parts of the AWS SDK are still
        # CommonJS and call it for Node's own built-ins. esbuild leaves those
        # calls in place and they throw the moment the function is loaded —
        # every request answered by API Gateway's own "Internal Server Error"
        # because our handler never ran. This gives the bundle a real `require`.
        Banner:
          - "js=import{createRequire as __createRequire}from'module';const require=__createRequire(import.meta.url);"
    Properties:
      Handler: handler.handler
      CodeUri: .
      Description: MFTournament HTTP API
      Environment:
        Variables:
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          PUBLIC_CACHE_SECONDS: !Ref PublicCacheSeconds
          SERVER_CACHE_SECONDS: !Ref ServerCacheSeconds
          ADMIN_CACHE_SECONDS: !Ref AdminCacheSeconds
          S3_BUCKET: !Ref ImagesBucket
          TABLE_ORGANIZERS: !Sub '${TablePrefix}-organizers'
          TABLE_TEAMS: !Sub '${TablePrefix}-teams'
          TABLE_TOURNAMENTS: !Sub '${TablePrefix}-tournaments'
          TABLE_MATCHES: !Sub '${TablePrefix}-matches'
          TABLE_AUTH_USERS: !Sub '${TablePrefix}-auth-users'
          TABLE_AUTH_SESSIONS: !Sub '${TablePrefix}-auth-sessions'
          TABLE_PASSWORD_RESETS: !Ref PasswordResetsTable
          TABLE_AUDIT: !Ref AuditTable
          TABLE_INVITES: !Ref InvitesTable
          TABLE_ENTRIES: !Ref EntriesTable
          SITE_URL: !Ref SiteUrl
          MAIL_FROM: !Ref MailFrom
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: AppTables
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource:
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-organizers'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-organizers/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-teams'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-teams/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-tournaments'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-tournaments/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-auth-users'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-auth-users/index/*'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-auth-sessions'
                - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}-auth-sessions/index/*'
                - !GetAtt PasswordResetsTable.Arn
                - !GetAtt AuditTable.Arn
                - !GetAtt InvitesTable.Arn
                - !Sub '${InvitesTable.Arn}/index/*'
                - !GetAtt EntriesTable.Arn
                - !Sub '${EntriesTable.Arn}/index/*'
            - Sid: Images
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${ImagesBucket}/*'
            # One message: the link that gets somebody back into their account.
            - Sid: SendPasswordResets
              Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        AnyRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

  # A reset link is a password in an email: single use, dead within the hour,
  # and swept up by DynamoDB itself afterwards.
  PasswordResetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-password-resets'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
      Tags:
        - Key: Project
          Value: mftournament

  # Who changed what. One partition, newest first: this is a log, not a dataset.
  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-audit'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: at
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: at
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: mftournament

  # An invitation to run a club: one use, a fortnight to use it.
  InvitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-invites'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
      Tags:
        - Key: Project
          Value: mftournament

  # A club's participation in one competition. Keyed by the pair, because a club
  # enters a competition once; the index answers "which competitions is this
  # club in", which is the club page's whole question.
  EntriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-entries'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tournamentId
          AttributeType: S
        - AttributeName: teamId
          AttributeType: S
      KeySchema:
        - AttributeName: tournamentId
          KeyType: HASH
        - AttributeName: teamId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: teamId-index
          KeySchema:
            - AttributeName: teamId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: mftournament

# Note: sessions last seven days and the API deletes an expired one the moment
# it is presented. If you later add a numeric "expiresAtEpoch" attribute, turn on
# DynamoDB TTL for the auth-sessions table so dead rows also disappear on their own.

Outputs:
  ApiUrl:
    Description: Base URL for the API. Put this in the frontend as VITE_API_BASE_URL.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  FunctionRole:
    Description: Execution role the API runs as.
    Value: !GetAtt ApiFunctionRole.Arn
